name: Check starter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres-and-sdk:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit
        ports: ["54327:5432"]
        options: --health-cmd "pg_isready -U kit" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://kit:kit@localhost:54327/kit
      - run: docker build -t shopify-python-kit:check .
