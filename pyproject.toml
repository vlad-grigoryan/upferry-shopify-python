[project]
name = "upferry-shopify-python"
version = "0.1.0"
description = "A portable FastAPI Shopify app with Postgres and a background worker"
requires-python = ">=3.12"
dependencies = [
  "shopifyapp==1.0.2",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.6",
  "psycopg[binary]==3.3.6",
  "cryptography==50.0.2",
  "python-dotenv==1.2.4",
  "alembic>=1.16,<2",
  "tomlkit>=0.13,<1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
